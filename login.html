  <title>BCM | Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050008 url('https://yscggkgvxfjvfmnulrcy.supabase.co/storage/v1/object/public/Media/Screenshot%202026-08-01%20at%2013.37.42.png') center / cover no-repeat fixed;
      color: #1a1a1a;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      width: 900px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
      background: #fff;
    }

    /* LEFT - form panel */
    .panel-left {
      flex: 0 0 50%;
      padding: 56px 48px;
      background: #fff;
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0 0 12px 0;
    }

    h1 strong {
      color: #7B2FBE;
      font-weight: 800;
    }

    .subtitle {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.6;
      margin: 0 0 32px 0;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e5e5e7;
      border-radius: 10px;
      height: 48px;
      padding: 0 16px;
      font-size: 14px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: #7B2FBE;
    }

    input::placeholder {
      color: #b3b3b3;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      height: 48px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
      font-family: inherit;
      display: block;
      text-align: center;
      text-decoration: none;
      line-height: 48px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-link {
      color: #7B2FBE;
      text-decoration: underline;
      font-size: 13px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-top: 12px;
      display: inline-block;
      font-family: inherit;
    }

    .btn-outline {
      width: 100%;
      background: #fff;
      border: 1.5px solid #7B2FBE;
      color: #7B2FBE;
      border-radius: 10px;
      height: 48px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-family: inherit;
    }

    .btn-outline:hover {
      background: #7B2FBE0d;
    }

    .not-registered {
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
      border-top: 1px solid #eee;
      padding-top: 20px;
      margin: 24px 0 16px 0;
      text-align: center;
    }

    .risk-warning {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      margin-top: 16px;
    }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
    }

    .status.error {
      background: #fdecec;
      border: 1px solid #f3c1c1;
      color: #b3261e;
      display: block;
    }

    .status.loading {
      background: #f3ecfb;
      border: 1px solid #dcc4f2;
      color: #7B2FBE;
      display: block;
    }

    .status.success {
      background: #e9f8ee;
      border: 1px solid #b6e3c4;
      color: #1c7a3e;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #7B2FBE33;
      border-top-color: #7B2FBE;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .back-link {
      font-size: 12px;
      color: #6b7280;
      cursor: pointer;
      margin-bottom: 24px;
      display: inline-block;
    }

    .back-link:hover {
      color: #1a1a1a;
    }

    /* RIGHT - branding panel */
    .panel-right {
      flex: 0 0 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: #050008 url('https://yscggkgvxfjvfmnulrcy.supabase.co/storage/v1/object/public/Media/Screenshot%202026-07-30%20at%2018.38.50.png') center / cover no-repeat;
      position: relative;
      overflow: hidden;
    }

    .panel-right::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5,0,8,.35) 0%, rgba(5,0,8,.65) 100%), radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.25), transparent 55%);
    }

    .logo {
      max-width: 260px;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    /* floating support button */
    .support-fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 998;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 12px 32px rgba(123, 47, 190, .35);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .support-fab:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(123, 47, 190, .45);
    }

    .support-fab svg {
      width: 22px;
      height: 22px;
    }

    @media (max-width: 860px) {
      .card {
        flex-direction: column;
        width: 95vw;
      }

      .panel-right {
        display: none;
      }

      .panel-left {
        padding: 40px 28px;
      }
    }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
      padding: 0;
    }
    .pw-toggle:hover { color: #7B2FBE; }
    .pw-toggle svg { width: 18px; height: 18px; }
    .pw-toggle .eye-off { display: none; }
    .pw-toggle.showing .eye { display: none; }
    .pw-toggle.showing .eye-off { display: block; }
  </style>
</head>

<body>
  <div class="card">
    <div class="panel-left">

      <!-- Login -->
      <div class="screen active" id="screen-login">
        <h1><strong>Welcome!</strong> Please login</h1>
        <p class="subtitle">Access your Black Crown Markets account to manage your trading with ease.</p>
        <div class="field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="login-password" placeholder="••••••••" />
            <button type="button" class="pw-toggle" aria-label="Show password" onclick="togglePasswordVisibility('login-password', this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path class="eye" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle class="eye" cx="12" cy="12" r="3"></circle>
                <path class="eye-off" d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line class="eye-off" x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <button class="btn" id="loginBtn" onclick="login()">Login</button>
        <button class="btn-link" onclick="showScreen('screen-forgot')">Forgot your password?</button>
        <div class="status" id="login-status"></div>

        <p class="not-registered">Not yet registered to Black Crown Markets?</p>
        <a href="/register" class="btn-outline" id="realAccountLink">Open Real Account</a>
        <a href="/register-demo" class="btn-outline" id="demoAccountLink">Open Demo Account</a>
        <p class="risk-warning">Trading involves risk of loss</p>
      </div>

      <!-- Forgot Password -->
      <div class="screen" id="screen-forgot">
        <span class="back-link" onclick="showScreen('screen-login')">&larr; Back to Sign in</span>
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email and we'll send you a reset token</p>
        <div class="field">
          <label>Email</label>
          <input type="email" id="forgot-email" placeholder="your@email.com" />
        </div>
        <button class="btn" id="forgotBtn" onclick="forgotPassword()">Send Reset Token</button>
        <div class="status" id="forgot-status"></div>
      </div>

    </div>

  <script>
    const PORTAL = 'https://trade.blackcrownmarkets.com';
    const PROXY = '/api';

    // Carry the affiliate/IB code through to registration if present
    (function propagateAffiliate() {
      const ibid = (new URLSearchParams(window.location.search).get('ibid') || '').replace(/\D/g, '');
      if (!ibid) return;
      const real = document.getElementById('realAccountLink');
      const demo = document.getElementById('demoAccountLink');
      real.href = real.href + (real.href.includes('?') ? '&' : '?') + 'ibid=' + encodeURIComponent(ibid);
      demo.href = demo.href + (demo.href.includes('?') ? '&' : '?') + 'ibid=' + encodeURIComponent(ibid);
    })();

    function togglePasswordVisibility(id, btn) {
      const input = document.getElementById(id);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.classList.toggle('showing', show);
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function setStatus(id, type, msg) {
      const el = document.getElementById(id);
      el.className = 'status ' + type;
      el.innerHTML = msg;
    }

    // A killed or crashed function returns an HTML error page, not JSON, so
    // res.json() throws and the caller's catch reports it as a rejected
    // credential. Surface the transport failure instead.
    async function readJson(res, label) {
      const raw = await res.text();
      try {
        return JSON.parse(raw);
      } catch (e) {
        throw new Error(`${label} failed: server returned ${res.status} ${res.statusText || ''}`.trim() + '. Please try again.');
      }
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('loginBtn');
      if (!email || !password) { setStatus('login-status', 'error', 'Please enter your email and password.'); return; }
      btn.disabled = true;
      setStatus('login-status', 'loading', '<span class="spinner"></span> Signing in...');
      try {
        const res = await fetch(`${PROXY}/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await readJson(res, 'Sign-in');
        // Only a real Skale rejection means bad credentials. Anything else --
        // a proxy error, a missing secret, an upstream timeout -- has to show
        // its own cause, or a broken backend is indistinguishable from a typo.
        // Skale rejects a bad request with an OAuth-shaped {error,
        // error_description}; error_description is the readable half.
        if (data.error || data.error_description) {
          throw new Error(data.error_description || data.error);
        }
        // Skale is not consistent about which field carries success: the
        // registration pages read status_code, this one read status, against
        // the same /api/v-2 endpoint. api/login.js already normalises the
        // token onto object._token wherever it arrives, and the token is what
        // actually matters -- if one came back, the credentials were accepted.
        // Gating on the status field instead meant a shape we did not expect
        // was reported to the user as a rejected password.
        const sessionToken = data.object?._token;
        if (!sessionToken) throw new Error(data.message || 'Invalid email or password.');
        setStatus('login-status', 'success', '&#10003; Redirecting...');
        setTimeout(() => { window.location.href = `${PORTAL}/silent-login?_token=${sessionToken}`; }, 800);
      } catch (err) {
        setStatus('login-status', 'error', err.message || 'Something went wrong.');
        btn.disabled = false;
      }
    }

    async function forgotPassword() {
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.getElementById('forgotBtn');
      if (!email) { setStatus('forgot-status', 'error', 'Please enter your email.'); return; }
      btn.disabled = true;
      setStatus('forgot-status', 'loading', '<span class="spinner"></span> Sending reset token...');
      try {
        const res = await fetch(`${PROXY}/forgot-password`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
        const data = await readJson(res, 'Password reset');
        if (data.error || data.error_description) {
          throw new Error(data.error_description || data.error);
        }
        if (data.status !== 'Success') throw new Error(data.message || 'Email not found.');
        setStatus('forgot-status', 'success', '&#10003; Check your email for a link to reset your password.');
        btn.disabled = false;
      } catch (err) {
        setStatus('forgot-status', 'error', err.message || 'Something went wrong.');
        btn.disabled = false;
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const active = document.querySelector('.screen.active').id;
      if (active === 'screen-login') login();
      else if (active === 'screen-forgot') forgotPassword();
    });
  </script>
